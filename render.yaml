# Render Blueprint — $0 upfront (Free plan)
# Deploy: render.com → "New +" → "Blueprint" → pick this repo.
# The whole repo is cloned; `rootDir: server` sets where Node runs.
# static (public/) and uploads/ live one level up, so server.js finds them.

services:
  - type: web
    name: ai-study-buddy
    runtime: node
    rootDir: server
    plan: free                        # $0/month
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Your OpenAI key. Render hides this value once saved.
      # Paste your key (the one you saved as STUDORA_OPENAI_KEY) here.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Auto-generate a strong JWT secret so auth tokens are secure.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: AI_MAX_TOKENS
        value: "1200"
      # Free-plan quotas.
      - key: FREE_DAILY_CHAT
        value: "15"
      - key: FREE_MONTHLY_QUIZZES
        value: "3"
      - key: FREE_MAX_MATERIALS
        value: "5"
      - key: FREE_FLASHCARD_SETS
        value: "2"
