<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6C5CE7" />
  <title>AI Study Buddy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Add to Home Screen (PWA-lite): works offline-friendly once installed -->
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="app"></div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Bottom navigation (hidden on auth/onboarding screens) -->
  <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Primary">
    <button data-route="home" class="nav-item active">
      <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
    </button>
    <button data-route="subjects" class="nav-item">
      <span class="nav-icon">📚</span><span class="nav-label">Subjects</span>
    </button>
    <button data-route="chat" class="nav-item">
      <span class="nav-icon">🤖</span><span class="nav-label">AI Tutor</span>
    </button>
    <button data-route="progress" class="nav-item">
      <span class="nav-icon">📈</span><span class="nav-label">Progress</span>
    </button>
    <button data-route="profile" class="nav-item">
      <span class="nav-icon">👤</span><span class="nav-label">Profile</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
